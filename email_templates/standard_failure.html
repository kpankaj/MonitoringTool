<!doctype html>
<html>
  <body style="margin:0;background:#f1f5f9;font-family:Arial,sans-serif;color:#0f172a">
    <div style="max-width:640px;margin:24px auto;background:#fff;border-radius:12px;overflow:hidden">
      <div style="padding:20px 28px;background:#b91c1c;color:#fff">
        <h1 style="margin:0;font-size:22px">Interface failure: $interface_name</h1>
      </div>
      <div style="padding:28px">
        <p><strong>Status:</strong> $status</p>
        <p><strong>Folder:</strong> $folder_path</p>
        <p><strong>Run summary:</strong> $run_summary</p>
        <h2 style="font-size:18px">Detected issues</h2>
        <ul>$failure_reasons</ul>
      </div>
    </div>
  </body>
</html>
